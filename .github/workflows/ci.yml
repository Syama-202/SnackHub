# Every push to main and every pull request: the backend tests against a real PostgreSQL 17 and
# Redis (the same schemas, module roles and migrations as local development), the frontend
# unit tests and both frontend builds. Nothing here deploys, and no real keys are used: the
# passwords below exist only inside these throwaway containers, and payments stay off.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: snackhub
      DB_MIGRATOR_USER: sh_migrator
      DB_MIGRATOR_PASSWORD: ci-migrator-password
      DB_MODULE_PASSWORD: ci-module-password
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # the same script that prepares a developer's machine, run without questions
      - name: Create the database, module schemas and roles
        env:
          PG_ADMIN_PASSWORD: ci-postgres-password
          MIGRATOR_PASSWORD: ci-migrator-password
          MODULE_DB_PASSWORD: ci-module-password
          SKIP_ENV_UPDATE: '1'
        run: node scripts/local-db-init.js
      - name: Migrate and seed the demo data
        run: |
          node scripts/migrate.js latest
          node scripts/seed.js
      - name: Tests
        run: npx vitest run

  frontend:
    name: Frontend tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # one dev dependency declares an older peer range; the lockfile pins what works
      - run: npm ci --legacy-peer-deps
      - name: Unit tests
        run: npx vitest run
      - name: Customer, seller and rider site
        run: npx vite build
      - name: Admin console
        run: npx vite build -c vite.admin.config.js
