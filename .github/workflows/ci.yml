# Every push to main and every pull request: the backend tests against a real MySQL 8.4 and
# Redis (the same schemas, module users and migrations as local development), the frontend
# unit tests and both frontend builds. Nothing here deploys, and no real keys are used: the
# passwords below exist only inside these throwaway containers, and payments stay off.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: snackhub
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_MIGRATOR_USER: sh_migrator
      DB_MIGRATOR_PASSWORD: ci-migrator-password
      DB_MODULE_PASSWORD: ci-module-password
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Create the module schemas and users
        working-directory: .
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_ROOT_PASSWORD: ci-root-password
          MIGRATOR_PASSWORD: ci-migrator-password
          MODULE_DB_PASSWORD: ci-module-password
        run: |
          # the migrations create triggers, which binary logging allows only with this on
          mysql -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SET GLOBAL log_bin_trust_function_creators = 1"
          bash infra/mysql/init/01-schemas-and-users.sh
      - run: npm ci
      - name: Migrate and seed the demo data
        run: |
          node scripts/migrate.js latest
          node scripts/seed.js
      - name: Tests
        run: npx vitest run

  frontend:
    name: Frontend tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # one dev dependency declares an older peer range; the lockfile pins what works
      - run: npm ci --legacy-peer-deps
      - name: Unit tests
        run: npx vitest run
      - name: Customer, seller and rider site
        run: npx vite build
      - name: Admin console
        run: npx vite build -c vite.admin.config.js
