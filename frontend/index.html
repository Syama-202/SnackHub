<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/icon-32.png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF7A00" />
    <meta name="description" content="SnackHub delivers India's regional snacks from verified local shops. Estimated delivery in 25 to 30 minutes, subject to serviceability and preparation time." />
    <!-- what WhatsApp, LinkedIn and X show when someone shares a link -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SnackHub" />
    <meta property="og:title" content="SnackHub · Hometown snacks, delivered" />
    <meta property="og:description" content="Regional snacks from verified local shops in Andhra Pradesh and Telangana." />
    <meta property="og:image" content="https://snackhub-india.netlify.app/assets/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SnackHub: a spread of murukku, samosas, jalebi and banana chips" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; system fonts show until they arrive -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" /></noscript>
