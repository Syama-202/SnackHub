# The customer, seller and rider site on Netlify (doc 15.0). Base directory: frontend.
# /api/* is proxied to the API on Render, so the browser talks to one origin and the sign-in
# cookie stays first-party. The proxy is signed with PROXY_SIGNING_SECRET (set it in this
# site's environment variables with the Runtime scope; the same value as on Render), which
# lets the API trust each visitor's address. If your Render service has another name, change
# the onrender.com address below, VITE_SOCKET_URL and the Content-Security-Policy.

[build]
  command = "npm run build:web"
  publish = "dist"
  # build when the frontend or the shared rules it imports change (Netlify only looks at the
  # base directory by default)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../shared"

[build.environment]
  NODE_VERSION = "22"
  # live updates go straight to the API: Netlify's proxy cannot carry sockets
  VITE_SOCKET_URL = "https://snackhub-jps8.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://snackhub-jps8.onrender.com/api/:splat"
  status = 200
  force = true
  signed = "PROXY_SIGNING_SECRET"

# the React app answers every other path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # what the pages may load (checked with the map, Google sign-in, Razorpay's window, the
    # fonts and the demo): inline style attributes are allowed, scripts only from this site,
    # Google sign-in and Razorpay's checkout script, plus the one hashed inline handler that
    # loads the fonts without blocking the first paint. Razorpay's window is a frame from
    # api.razorpay.com. A new outside service (analytics, another map) must be added here first.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-1jAmyYXcRq6zFldLe/GCgIDJBiOONdXjTLgEFMDnDSM=' https://accounts.google.com/gsi/client https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.razorpay.com; connect-src 'self' https://snackhub-jps8.onrender.com wss://snackhub-jps8.onrender.com https://tiles.openfreemap.org https://accounts.google.com/gsi/ https://api.razorpay.com https://lumberjack.razorpay.com; worker-src 'self' blob:; frame-src https://accounts.google.com/gsi/ https://api.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

# hashed build files never change, so browsers keep them
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# photos and icons keep their names when replaced: a day, then checked again
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
