# Local development stack (doc 14.1). Data stores listen on 127.0.0.1 only, never on the
# network (doc 16.5 #12). Passwords come from infra/.env (copy infra/.env.example).
name: snackhub

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    # 5433 on the host so it does not clash with a PostgreSQL already installed on the machine.
    # The schemas and roles come from `npm run db:docker` once the container is up.
    ports: ['127.0.0.1:5433:5432']
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4
    command: ['redis-server', '--appendonly', 'yes']
    # 6380 on the host so it does not clash with another project's Redis on 6379
    ports: ['127.0.0.1:6380:6379']
    volumes: ['redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  rabbit:
    # not used by the code yet (doc 9.0, Future): starts only with --profile later
    profiles: ['later']
    image: rabbitmq:3.13-management
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      retries: 20

  elastic:
    # snack search (doc 12.3): starts with --profile search (npm run search:up); without it the
    # API searches PostgreSQL instead
    profiles: ['search']
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # Security off only on this laptop stack; never on a reachable host (doc 12.2)
      xpack.security.enabled: 'false'
    # 9201 on this laptop, so it never meets another project's Elasticsearch on 9200
    ports: ['127.0.0.1:9201:9200']
    volumes: ['elastic:/usr/share/elasticsearch/data']

  minio:
    # not used by the code yet (doc 9.0, Future): starts only with --profile later
    profiles: ['later']
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-snackhub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio:/data']

  mailpit:
    image: axllent/mailpit:v1.20
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']

volumes:
  postgres: {}
  redis: {}
  elastic: {}
  minio: {}
