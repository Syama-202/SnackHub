# Local development stack (doc 14.1). Data stores listen on 127.0.0.1 only, never on the
# network (doc 16.5 #12). Passwords come from infra/.env (copy infra/.env.example).
name: snackhub

services:
  mysql:
    image: mysql:8.4
    # lets the migrator create the append-only triggers on ledger_entries without SUPER
    command: ['--log-bin-trust-function-creators=1']
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in infra/.env}
      MYSQL_DATABASE: snackhub
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD in infra/.env}
      MODULE_DB_PASSWORD: ${MODULE_DB_PASSWORD:?set MODULE_DB_PASSWORD in infra/.env}
    # 3307 on the host so it does not clash with a MySQL already installed on the machine
    ports: ['127.0.0.1:3307:3306']
    volumes:
      - mysql:/var/lib/mysql
      # one schema and one least-privilege user per module, created on first start
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4
    command: ['redis-server', '--appendonly', 'yes']
    # 6380 on the host so it does not clash with another project's Redis on 6379
    ports: ['127.0.0.1:6380:6379']
    volumes: ['redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  rabbit:
    image: rabbitmq:3.13-management
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      retries: 20

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # Security off only on this laptop stack; never on a reachable host (doc 12.2)
      xpack.security.enabled: 'false'
    ports: ['127.0.0.1:9200:9200']
    volumes: ['elastic:/usr/share/elasticsearch/data']

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-snackhub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio:/data']

  mailpit:
    image: axllent/mailpit:v1.20
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']

volumes:
  mysql: {}
  redis: {}
  elastic: {}
  minio: {}
